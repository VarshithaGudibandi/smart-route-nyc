name: smartroute

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartroute}:${POSTGRES_PASSWORD:-smartroute}@postgres:5432/${POSTGRES_DB:-smartroute}
  REDIS_URL: redis://redis:6379/0
  OTP_BASE_URL: http://otp:8080
  OTP_GRAPH_VERSION_FILE: /otp-data/graph/graph-version
  GTFS_MANIFEST_FILE: /otp-data/graph/manifest.json
  KEY_HASHING_SECRET: ${KEY_HASHING_SECRET:-development-only-secret}
  # Claude powers typed preferences, explanations and transfer ideas when a
  # key is set; without one the app runs on deterministic rules.
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  # Prometheus metrics, reachable only on the Compose network.
  METRICS_PORT: "9100"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartroute}
      POSTGRES_DB: ${POSTGRES_DB:-smartroute}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Cache and coordination only: nothing in Redis needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otp:
    image: opentripplanner/opentripplanner:2.10.0@sha256:8d54e5c589186707ee365417f2202dc878c451fa3001b8edff07019531100933
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_SERVE_HEAP:-6g}"
    volumes:
      - ./data/otp/graph:/var/opentripplanner
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      # The parent directory, so a rebuilt graph/ is seen without recreating
      # the container.
      - ./data/otp:/otp-data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion"]
    environment: *backend-env
    volumes:
      - ./data/otp:/otp-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: ./start.sh --with-dashboards, or docker compose --profile dashboards up -d
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [dashboards]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [dashboards]
    environment:
      # Local use only: anyone who can reach 127.0.0.1:3001 can view, not edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smartroute.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
