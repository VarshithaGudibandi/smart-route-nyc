name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  backend:
    name: Backend (types and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Type check
        run: uv run mypy app tests evals alembic scripts
      - name: Tests (unit and integration, with PostgreSQL and Redis containers)
        run: uv run pytest -v
      - name: Preference interpretation evaluation (baseline)
        run: uv run python -m evals.preferences
      - name: Explanation grounding evaluation
        run: uv run python -m evals.explanations
      - name: Frontend API schema is up to date
        run: |
          uv run python -m scripts.export_openapi ../frontend/src/lib/openapi.json
          git diff --exit-code ../frontend/src/lib/openapi.json

  frontend:
    name: Web app (types, lint, tests, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the schema
        run: |
          npm run api:types
          git diff --exit-code src/lib/api-types.ts
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests with accessibility checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  otp-scripts:
    name: OTP data scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s otp/tests -v

  docker:
    name: Container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: smartroute-${{ matrix.context }}:ci
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
      # Pinned to a commit: this action's version tags were once hijacked
      # (CVE-2026-33634). v0.36.0, an immutable release.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: smartroute-${{ matrix.context }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Python packages shipped in the API image
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt -q > requirements.txt
          uvx pip-audit --disable-pip --strict -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm packages shipped in the web app
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
