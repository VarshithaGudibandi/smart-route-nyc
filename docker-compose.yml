name: smartroute

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartroute}:${POSTGRES_PASSWORD:-smartroute}@postgres:5432/${POSTGRES_DB:-smartroute}
  REDIS_URL: redis://redis:6379/0
  OTP_BASE_URL: http://otp:8080
  OTP_GRAPH_VERSION_FILE: /otp-data/graph/graph-version
  GTFS_MANIFEST_FILE: /otp-data/graph/manifest.json
  KEY_HASHING_SECRET: ${KEY_HASHING_SECRET:-development-only-secret}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartroute}
      POSTGRES_DB: ${POSTGRES_DB:-smartroute}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Cache and coordination only: nothing in Redis needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otp:
    image: opentripplanner/opentripplanner:2.10.0@sha256:8d54e5c589186707ee365417f2202dc878c451fa3001b8edff07019531100933
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_SERVE_HEAP:-6g}"
    volumes:
      - ./data/otp/graph:/var/opentripplanner
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      # The parent directory, not graph/ itself: refresh_graph.sh swaps graph/
      # by renaming, and a direct bind mount would keep the old directory.
      - ./data/otp:/otp-data:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion"]
    environment: *backend-env
    volumes:
      - ./data/otp:/otp-data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
