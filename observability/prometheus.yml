# Scrapes the API and the ingestion worker over the Compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["backend:9100"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
